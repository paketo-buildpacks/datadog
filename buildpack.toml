api = "0.7"

[buildpack]
  description = "A Cloud Native Buildpack that contributes and configures the Datadog Agent"
  homepage = "https://github.com/paketo-buildpacks/datadog"
  id = "paketo-buildpacks/datadog"
  keywords = ["java"]
  name = "Paketo Buildpack for Datadog"
  sbom-formats = ["application/vnd.syft+json", "application/vnd.cyclonedx+json"]
  version = "{{.version}}"

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/maven/blob/main/LICENSE"

[metadata]
  include-files = ["LICENSE", "NOTICE", "README.md", "linux/amd64/bin/build", "linux/amd64/bin/detect", "linux/amd64/bin/run", "linux/amd64/bin/helper", "linux/arm64/bin/build", "linux/arm64/bin/detect", "linux/arm64/bin/run", "linux/arm64/bin/helper", "buildpack.toml"]
  pre-package = "scripts/build.sh --target linux/amd64 --target linux/arm64"

  [[metadata.configurations]]
    build = true
    default = "false"
    description = "whether to contribute the Datadog trace agent"
    name = "BP_DATADOG_ENABLED"

  [[metadata.configurations]]
    default = "false"
    description = "whether to disable the Datadog trace agent (non native-image Java applications only!)"
    launch = true
    name = "BPL_DATADOG_DISABLED"

  [[metadata.dependencies]]
    checksum = "sha256:b553475e2f00726cb8a7cd1c227dbe9236d4877869a85d57f4077cbc326332f4"
    cpe = "cpe:2.3:a:datadoghq:java-agent:1.68.0:*:*:*:*:*:*:*"
    id = "datadog-agent-java"
    name = "Datadog Java Agent"
    purl = "pkg:generic/datadog-java-agent@1.68.0"
    sha256 = "b553475e2f00726cb8a7cd1c227dbe9236d4877869a85d57f4077cbc326332f4"
    source = "https://repo1.maven.org/maven2/com/datadoghq/dd-java-agent/1.68.0/dd-java-agent-1.68.0-sources.jar"
    source-checksum = "sha256:af05bb316e3802b6bf743665acae62358bb464b5a83abb4ead75e0094a044d42"
    stacks = ["*"]
    uri = "https://repo1.maven.org/maven2/com/datadoghq/dd-java-agent/1.68.0/dd-java-agent-1.68.0.jar"
    version = "1.68.0"

    [[metadata.dependencies.licenses]]
      type = "Apache-2.0"
      uri = "https://github.com/DataDog/dd-trace-java/blob/master/LICENSE"

  [[metadata.dependencies]]
    checksum = "sha256:86c97c1348277bb024f6185c4fd15a5567c50ab648f88277dffc429adb4bf927"
    cpe = "cpe:2.3:a:datadoghq:java-agent:1.68.1:*:*:*:*:*:*:*"
    id = "datadog-agent-java"
    name = "Datadog Java Agent"
    purl = "pkg:generic/datadog-java-agent@1.68.1"
    sha256 = "86c97c1348277bb024f6185c4fd15a5567c50ab648f88277dffc429adb4bf927"
    source = "https://repo1.maven.org/maven2/com/datadoghq/dd-java-agent/1.68.1/dd-java-agent-1.68.1-sources.jar"
    source-checksum = "sha256:49999a6f2fd628d0f0085755ff2815ccc9855763aa30f3b89aef5424bbbc2998"
    stacks = ["*"]
    uri = "https://repo1.maven.org/maven2/com/datadoghq/dd-java-agent/1.68.1/dd-java-agent-1.68.1.jar"
    version = "1.68.1"

    [[metadata.dependencies.licenses]]
      type = "Apache-2.0"
      uri = "https://github.com/DataDog/dd-trace-java/blob/master/LICENSE"

  [[metadata.dependency-constraints]]
    constraint = "1.*"
    id = "datadog-agent-java"
    patches = 2

[[stacks]]
  id = "*"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
